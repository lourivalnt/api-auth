server:
  port: 8080

spring:
  application:
    name: auth-api

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5433/authdb
    username: authuser
    password: authpass

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true
    
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6380

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics

  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: YOUR_SUPER_SECRET_KEY_CHANGE_IN_PRODUCTION
  expiration: 900000
  refresh-expiration: 604800000